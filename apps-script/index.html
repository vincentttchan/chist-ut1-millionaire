    <style>
        body {
            background: radial-gradient(circle at center, #1a237e 0%, #000000 100%);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
        }
        .millionaire-btn {
            background: linear-gradient(to bottom, #000066 0%, #0000cc 50%, #000066 100%);
            border: 2px solid #cccc00;
            border-radius: 50px;
            box-shadow: inset 0 0 10px #000, 0 0 5px #cccc00;
            transition: all 0.2s ease;
            position: relative;
        }
        .millionaire-btn::before, .millionaire-btn::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 20px;
            height: 2px;
            background: #cccc00;
        }
        .millionaire-btn::before { left: -20px; }
        .millionaire-btn::after { right: -20px; }
        .millionaire-btn:hover:not(:disabled) {
            background: linear-gradient(to bottom, #003399 0%, #0066ff 50%, #003399 100%);
            cursor: pointer;
            transform: scale(1.02);
        }
        .millionaire-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            border-color: #666;
            box-shadow: none;
        }
        .millionaire-btn:disabled::before, .millionaire-btn:disabled::after { background: #666; }
        
        .answer-btn {
            clip-path: polygon(5% 0%, 95% 0%, 100% 50%, 95% 100%, 5% 100%, 0% 50%);
            padding: 15px 30px;
            margin: 10px 0;
            border: 2px solid white;
            background: linear-gradient(to bottom, #000033, #000099);
            transition: all 0.3s;
            text-align: left;
            position: relative;
        }
        .answer-btn:hover:not(:disabled) {
            background: linear-gradient(to bottom, #cc7a00, #ff9900); /* Hover Orange */
            cursor: pointer;
        }
        .answer-selected { background: linear-gradient(to bottom, #cc7a00, #ff9900) !important; }
        .answer-correct { background: linear-gradient(to bottom, #006600, #00cc00) !important; animation: blink-green 0.5s 3; }
        .answer-wrong { background: linear-gradient(to bottom, #660000, #cc0000) !important; }
        .answer-hidden { visibility: hidden; }
        
        @keyframes blink-green {
            0% { background: linear-gradient(to bottom, #006600, #00cc00); }
            50% { background: linear-gradient(to bottom, #cc7a00, #ff9900); }
            100% { background: linear-gradient(to bottom, #006600, #00cc00); }
        }

        .prize-ladder { background: rgba(0,0,50,0.8); border: 1px solid #0055ff; }
        .prize-item { padding: 4px 10px; border-radius: 4px; }
        .prize-current { background-color: #ff9900; color: #000; font-weight: bold; }
        .prize-safe { color: #cccc00; font-weight: bold; }
        .prize-past { color: #888; }

        .modal-bg { background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(5px); }
        
        /* Bar chart for audience */
        .bar-container { display: flex; align-items: flex-end; height: 150px; gap: 10px; margin-top: 20px;}
        .bar-wrapper { display: flex; flex-direction: column; align-items: center; width: 25%; height: 150px; justify-content: flex-end; }
        .bar { width: 100%; background: linear-gradient(to top, #0055ff, #00aaff); border-radius: 4px 4px 0 0; transition: height 1s ease-out;}
        .bar-label { margin-top: 5px; font-weight: bold;}
        body { padding: 20px 12px; }
        #game-screen { height: calc(100vh - 40px); min-height: 600px; }
        .prize-ladder { flex-direction: column; }
        @media(max-width:767px) { #game-screen { height: auto; min-height: 0; } }
        #result-subtitle { line-height: 1.8; font-size: 1.1rem; }
        button:focus-visible,select:focus-visible,input:focus-visible { outline: 3px solid #fde047; outline-offset: 4px; }
        @media(max-width:767px) { #game-screen > div:first-child > div:first-child { flex-wrap:wrap; gap:12px; } #display-name { font-size:16px; } .answer-btn { padding:14px 24px; } }
    
        .board-open { display:block; margin:16px auto 0; color:#fde047; text-decoration:underline; font-weight:bold; }
        .board-open.hidden { display:none; }
        .rank-opt { display:flex;align-items:center;gap:8px; }
        .rank-opt input { width:18px;height:18px;accent-color:#facc15; }
        .board-panel { width:min(720px,100%);max-height:90vh;overflow:auto;padding:24px;background:#101b4d;border:2px solid #eab308;border-radius:18px; }
        .board-head { display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:12px; }
        .board-head h2 { font-size:26px;color:#fde047;font-weight:bold; }
        .board-head button { min-width:44px;min-height:44px; }
        .board-panel p { color:#cbd5e1;line-height:1.7;font-size:14px;margin:8px 0; }
        .board-controls { display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:18px 0; }
        .board-controls select,.board-controls button { background:#1e3a8a;border:1px solid #64748b;border-radius:6px;padding:8px 14px; }
        .board-table-wrap { overflow-x:auto; }
        .board-table { width:100%;border-collapse:collapse;text-align:left; }
        .board-table th { color:#fde047;white-space:nowrap; }
        .board-table th,.board-table td { padding:10px 6px;border-bottom:1px solid #334155; }
        .board-table td:nth-child(2) { overflow-wrap:anywhere; }
        .review-panel { text-align:left;margin-bottom:18px;border:1px solid #475569;border-radius:8px;padding:12px; }
        .review-panel summary { cursor:pointer;color:#fde047; }
        #answer-review { max-height:320px;overflow:auto; }
        .review-card { border-bottom:1px solid #475569;padding:12px 0;font-size:14px;line-height:1.8; }
        .review-card p:first-child { font-weight:bold; }

    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center">

    <div id="intro-screen" class="w-full max-w-md p-8 bg-gray-900 bg-opacity-90 rounded-2xl border-2 border-yellow-500 shadow-2xl text-center z-10">
        <h1 class="text-3xl font-bold text-yellow-400 mb-6 tracking-wider">中史溫習<br><span class="text-5xl mt-2 block text-white drop-shadow-[0_0_10px_rgba(255,215,0,0.8)]">百萬富翁</span></h1>
        <label for="grade" class="block text-yellow-300 mb-2">選擇溫習題庫</label><select id="grade" onchange="updateScope()" class="w-full p-3 bg-gray-800 border border-yellow-500 rounded mb-3"><option value="s1">中一｜上古至春秋戰國</option><option value="s2">中二｜五代十國與宋代</option></select><p id="scope" class="text-gray-300 mb-3"></p><p class="text-sm text-gray-400 mb-6">每庫45題，每局抽30題；第10及20題為保險線。<br>觀眾及朋友為電腦模擬，提示可能不正確。</p>
        <div class="space-y-4 mb-6 text-left">
          <label for="student-name" class="block text-sm text-gray-300">遊戲暱稱（2–16字，請勿填真名）</label>
          <input maxlength="16" type="text" id="student-name" placeholder="例：歷史小達人" autocomplete="off" class="w-full p-2 bg-gray-800 border border-gray-600 rounded text-white">
          <label class="rank-opt"><input type="checkbox" id="ranked-mode"> 本局參加線上排行榜</label>
          <p id="online-mode-note" class="text-sm text-gray-400"></p>
        </div>

        // ------------------ 題庫設定 (每級45題，共90題) ------------------
        const questionBanks = {"s1": {"easy": [{"id": "s1-easy-01", "q": "依據筆記，舊石器時代先民主要居於哪裏？", "options": ["洞穴", "木造房屋", "夯土宮室", "磚造民居"], "ans": 0, "explanation": "筆記把洞穴居住列為舊石器時代的生活特徵。", "topic": "華夏起源"}, {"id": "s1-easy-02", "q": "舊石器時代的石器主要有甚麼特點？", "options": ["粗製石器", "磨製石器", "青銅工具", "鐵製工具"], "ans": 0, "explanation": "舊石器較粗製；新石器時代才發展經磨製的石器。", "topic": "華夏起源"}, {"id": "s1-easy-03", "q": "哪項是筆記所列的新石器時代生產活動？", "options": ["耕作及畜牧", "採集及狩獵為主", "製作青銅禮器", "以鐵器耕田"], "ans": 0, "explanation": "新石器先民懂耕作及畜牧，生活方式較前進步。", "topic": "華夏起源"}, {"id": "s1-easy-04", "q": "相同血緣的先民聚居形成甚麼群體？", "options": ["氏族", "部落聯盟", "諸侯國", "王朝"], "ans": 0, "explanation": "筆記區分氏族、部落及部落聯盟；氏族以相同血緣為基礎。", "topic": "華夏起源"}, {"id": "s1-easy-05", "q": "「炎黃子孫」的「炎黃」指哪兩位始祖？", "options": ["炎帝和黃帝", "黃帝和堯", "堯和舜", "舜和禹"], "ans": 0, "explanation": "炎帝、黃帝被尊為中華民族始祖。", "topic": "黃帝功績"}, {"id": "s1-easy-06", "q": "傳說中，嫘祖的主要貢獻是甚麼？", "options": ["養蠶取絲", "創造文字", "創制音律", "製造指南車"], "ans": 0, "explanation": "筆記把養蠶取絲歸於嫘祖；這屬傳說中的發明。", "topic": "黃帝功績"}, {"id": "s1-easy-07", "q": "傳說中，黃帝哪位部下創造文字？", "options": ["倉頡", "嫘祖", "堯", "禹"], "ans": 0, "explanation": "筆記記述倉頡造字；題幹保留「傳說中」以區別考證史實。", "topic": "黃帝功績"}, {"id": "s1-easy-08", "q": "堯選擇哪位以孝聞名的人繼任？", "options": ["舜", "禹", "啟", "湯"], "ans": 0, "explanation": "堯以舜為繼任人；舜後來再把共主之位交予禹。", "topic": "堯舜禹"}, {"id": "s1-easy-09", "q": "禹主要因哪項功績獲舜選為共主？", "options": ["治水", "創造文字", "發明音律", "推翻暴君"], "ans": 0, "explanation": "禹治水有功，是筆記所述獲舜選為共主的原因。", "topic": "堯舜禹"}, {"id": "s1-easy-10", "q": "禹的兒子是誰？", "options": ["啟", "桀", "湯", "武庚"], "ans": 0, "explanation": "啟繼位後，君位傳承由禪讓轉向世襲。", "topic": "夏朝"}, {"id": "s1-easy-11", "q": "夏朝最後一任君主是誰？", "options": ["桀", "啟", "湯", "紂王"], "ans": 0, "explanation": "桀是夏朝末代君主，後被湯推翻。", "topic": "夏朝"}, {"id": "s1-easy-12", "q": "誰推翻夏朝，建立商朝？", "options": ["湯", "禹", "啟", "周武王"], "ans": 0, "explanation": "湯推翻夏桀；周武王則是其後伐商。", "topic": "商朝"}, {"id": "s1-easy-13", "q": "殷墟出土、可作商代文字證據的是甚麼？", "options": ["甲骨文", "小篆", "隸書", "楷書"], "ans": 0, "explanation": "殷墟甲骨文是研究商代的重要文字材料。", "topic": "商朝"}, {"id": "s1-easy-14", "q": "商朝最後一任君主是誰？", "options": ["紂王", "桀", "周武王", "周幽王"], "ans": 0, "explanation": "夏末是桀、商末是紂王，兩者不可混淆。", "topic": "商朝"}, {"id": "s1-easy-15", "q": "哪組國家全屬戰國七雄？", "options": ["韓、趙、魏", "韓、趙、晉", "齊、秦、周", "楚、燕、宋"], "ans": 0, "explanation": "七雄為韓、趙、魏、楚、燕、齊、秦。", "topic": "春秋戰國"}], "medium": [{"id": "s1-medium-01", "q": "哪項正確比較兩個石器時代的工具？", "options": ["舊石器較粗製，新石器多經磨製", "舊石器多經磨製，新石器較粗製", "舊石器以銅器為主，新石器以鐵器為主", "舊石器以鐵器為主，新石器以銅器為主"], "ans": 0, "explanation": "筆記以石器製作技術區分兩個時代；銅器、鐵器並非此題的比較重點。", "topic": "華夏起源"}, {"id": "s1-medium-02", "q": "先民群居如何有助提高生產力？", "options": ["透過分工合作完成生產活動", "由每個家庭各自負責全部工作", "減少成員之間的合作與交流", "以血緣遠近代替工作分配"], "ans": 0, "explanation": "群居兼具安全與分工合作的好處。", "topic": "華夏起源"}, {"id": "s1-medium-03", "q": "部落聯盟推選的共同領袖稱為甚麼？", "options": ["共主", "諸侯", "天子使臣", "氏族成員"], "ans": 0, "explanation": "氏族組成部落，部落結成聯盟並推選共主。", "topic": "華夏起源"}, {"id": "s1-medium-04", "q": "傳說中黃帝被尊為「人文初祖」，與哪項貢獻最相關？", "options": ["多項發明改善先民生活", "把君位傳給自己的兒子", "以疏導方法治理洪水", "平定周代三監之亂"], "ans": 0, "explanation": "筆記把黃帝的發明與改善先民生活聯繫起來。", "topic": "黃帝功績"}, {"id": "s1-medium-05", "q": "把領袖位置傳給具才德的人，稱為甚麼制度？", "options": ["禪讓制", "世襲制", "分封制", "攝政制"], "ans": 0, "explanation": "禪讓重才德；世襲著重家族內傳承。", "topic": "堯舜禹"}, {"id": "s1-medium-06", "q": "哪項配對符合筆記對領袖傳承的描述？", "options": ["禪讓制—公天下", "禪讓制—家天下", "世襲制—公天下", "攝政制—禪讓天下"], "ans": 0, "explanation": "筆記以「公天下」概括禪讓，以「家天下」概括世襲。", "topic": "堯舜禹"}, {"id": "s1-medium-07", "q": "禹以疏導法治水，主要做法是甚麼？", "options": ["開通河道，把洪水引向大海", "加高堤壩，把洪水堵在原地", "遷走居民，放棄整理河道", "封閉河口，減少河水外流"], "ans": 0, "explanation": "疏導著重開通河道，與堵塞的治水思路不同。", "topic": "夏朝"}, {"id": "s1-medium-08", "q": "啟繼位，反映領袖傳承方式出現甚麼轉變？", "options": ["由禪讓轉為世襲", "由世襲轉為禪讓", "由分封轉為攝政", "由攝政轉為分封"], "ans": 0, "explanation": "啟是禹之子；父傳子標誌「家天下」的形成。", "topic": "夏朝"}, {"id": "s1-medium-09", "q": "依據筆記，商代被視為「信史」開始，理由是甚麼？", "options": ["有甲骨文提供文字證據", "傳說記載了黃帝多項發明", "君主曾多次遷移首都", "商朝已有軍隊及刑法"], "ans": 0, "explanation": "此處判準是文字證據；國家制度或傳說本身不是同一種證據。", "topic": "商朝"}, {"id": "s1-medium-10", "q": "筆記所述商朝多次遷都的原因之一是甚                     reject(new Error('排行榜連線逾時，可稍後重試或使用備用遊戲網址。'));
                },30000);
                function receive(event) {
                    const data=event.data;
                    if(!data || data.channel!==BRIDGE_CHANNEL || data.nonce!==nonce)return;
                    if(data.type==='bridge-ready' && !state.peer) {
                        if(!/^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/.test(event.origin) || !event.source)return;
                        state.peer=event.source;state.peerOrigin=event.origin;
                        clearTimeout(timeout);resolve(state);return;
                    }
                    if(event.source!==state.peer || event.origin!==state.peerOrigin || data.type!=='rpc-result')return;
                    const request=state.pending.get(data.requestId);
                    if(!request)return;
                    state.pending.delete(data.requestId);clearTimeout(request.timeout);
                    if(data.ok)request.resolve(data.value);
                    else request.reject(new Error(typeof data.error==='string'?data.error:'排行榜未能完成請求，請重試。'));
                }
                window.addEventListener('message',receive);
                const frame=document.createElement('iframe');state.frame=frame;
                frame.title='排行榜連線';frame.setAttribute('aria-hidden','true');frame.tabIndex=-1;
                frame.style.cssText='position:fixed;left:-10000px;top:0;width:1px;height:1px;border:0';
                frame.src=GOOGLE_LEADERBOARD_URL+'?view=bridge&origin='+encodeURIComponent(PAGES_ORIGIN)+'&nonce='+encodeURIComponent(nonce);
                document.body.appendChild(frame);
            });
            return state.promise;
        }
        async function bridgeCall(method,value) {
            const state=await connectPagesBridge();
            return new Promise((resolve,reject)=>{
                const requestId='req-'+crypto.randomUUID();
                const timeout=setTimeout(()=>{state.pending.delete(requestId);reject(new Error('排行榜回覆逾時；若已完成遊戲，可按「重試登榜」。'));},45000);
                state.pending.set(requestId,{resolve,reject,timeout});
                state.peer.postMessage({channel:BRIDGE_CHANNEL,nonce:state.nonce,type:'rpc',requestId,method,value},state.peerOrigin);
            });
        }
        function onlineCall(method, value) {
            if(!hasNativeService())return bridgeCall(method,value);
            return new Promise((resolve,reject)=>{
                let settled=false;
                const timeout=setTimeout(()=>{settled=true;reject(new Error('連線逾時，請稍後重試。'));},45000);
                google.script.run.withSuccessHandler(result=>{if(!settled){settled=true;clearTimeout(timeout);resolve(result);}})
                  .withFailureHandler(error=>{if(!settled){settled=true;clearTimeout(timeout);reject(new Error(error.message||'連線失敗，請重試。'));}})[method](value);
            });
        }
        function playerToken() {
            if(playerTokenMemory) return playerTokenMemory;
            try { playerTokenMemory = localStorage.getItem('ut1-player-v2') || ''; } catch (_) {}
            if(!playerTokenMemory) {
                playerTokenMemory = typeof crypto !== 'undefined' && crypto.randomUUID ? crypto.randomUUID() : 'player-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2);
                try { localStorage.setItem('ut1-player-v2',playerTokenMemory); } catch (_) {}
            }
            return playerTokenMemory;
        }
        async function startGame() {
            if(startPending) return;
            const name=document.getElementById('student-name').value.normalize('NFKC').trim();
            const error=document.getElementById('form-error');
            if(!/^[\p{L}\p{N}][\p{L}\p{N} _·-]{1,15}$/u.test(name)) {
                error.textContent='請輸入2–16字的暱稱，可用中文、英文字母及數字；請勿填真名。';error.classList.remove('hidden');return;
            }
            startPending=true;
            const button=document.getElementById('start-button');button.disabled=true;button.textContent='正在準備題目…';
            error.classList.add('hidden');
            try {
                selectedGrade=document.getElementById('grade').value; database=questionBanks[selectedGrade];
                studentData={name};
                try { localStorage.setItem('ut1-alias-v2',name); } catch (_) {}
                currentRun=null;
                let serverDeck=null;
                if(document.getElementById('ranked-mode').checked) {
                    currentRun=await onlineCall('startRankedRun',{version:BOARD_VERSION,grade:selectedGrade,alias:name,playerToken:playerToken()});
                    if(currentRun.version!==BOARD_VERSION)throw new Error('題庫版本不符，請重新整理。');
                    serverDeck=currentRun.deck;
                }
                resetRound(serverDeck);
            } catch(err) {
                error.textContent=err.message;error.classList.remove('hidden');currentRun=null;
            } finally {startPending=false;button.disabled=false;button.textContent='開始挑戰';}
        }
        function resetRound(serverDeck) {
            clearInterval(timerInterval);
            currentQIndex=0;lifelines={fifty:true,audience:true,friend:true};timerSeconds=0;isAnswering=false;guaranteedPrize=0;
            answerLog=[];pendingSubmission=null;submitBusy=false;
            document.getElementById('retry-upload').classList.add('hidden');
            document.getElementById('intro-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            document.getElementById('result-title').classList.remove('text-red-500');
            document.getElementById('result-title').classList.add('text-yellow-400');
            document.getElementById('display-name').textContent=`${selectedGrade==='s1'?'中一':'中二'} · ${studentData.name} · ${currentRun?'排行':'練習'}`;
            ['btn-5050','btn-audience','btn-friend'].forEach(id=>{document.getElementById(id).disabled=false;document.getElementById(id).classList.remove('opacity-30');});
            buildGameDeck(serverDeck);renderPrizeLadder();startTimer();loadQuestion();
        }
        function shuffle(array) {
            let currentIndex = array.length,  randomIndex;
            while (currentIndex > 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function buildGameDeck(serverDeck) {
            // 從各難度隨機抽10題
            let pEasy = shuffle([...database.easy]).slice(0, 10).map(q => ({...q, diff: 'easy'}));
            let pMed = shuffle([...database.medium]).slice(0, 10).map(q => ({...q, diff: 'medium'}));
            let pHard = shuffle([...database.hard]).slice(0, 10).map(q => ({...q, diff: 'hard'}));
            
            let rawDeck = [...pEasy, ...pMed, ...pHard];
            if(serverDeck) {
                const all=['easy','medium','hard'].flatMap(diff=>database[diff].map(q=>({...q,diff})));
                if(!Array.isArray(serverDeck)||serverDeck.length!==30)throw new Error('伺服器題目資料不完整。');
                rawDeck=serverDeck.map(entry=>{
                    const q=all.find(q=>q.id===entry.id);
                    if(!q||!Array.isArray(entry.options)||entry.options.length!==4||new Set(entry.options).size!==4||!entry.options.every(o=>q.options.includes(o)))throw new Error('題庫已更新，請重新整理。');
                    return {...q,serverOptions:entry.options};
                });
            }
            
            // 處理選項打亂，但記錄正確答案的新位置
            gameQuestions = rawDeck.map(q => {
                let optionsWithOriginalIndex = q.options.map((opt, idx) => ({ text: opt, originalIdx: idx }));
                if(q.serverOptions)optionsWithOriginalIndex=q.serverOptions.map(text=>({text,originalIdx:q.options.indexOf(text)}));
                else shuffle(optionsWithOriginalIndex);
                let newAnsIdx = optionsWithOriginalIndex.findIndex(opt => opt.originalIdx === q.ans);
                return {
                    id:q.id, explanation:q.explanation, topic:q.topic,
                    question: q.q,
                    options: optionsWithOriginalIndex.map(opt => opt.text),
                    correctIdx: newAnsIdx,
                    diff: q.diff
                };
            });
        }

        function renderPrizeLadder() {
            const ladder = document.querySelector('.prize-ladder');
            ladder.innerHTML = '';
            for (let i = 0; i < 30; i++) {
                let div = document.createElement('div');
                div.className = 'prize-item flex justify-between';
                div.id = `prize-${i}`;
                
                let num = document.createElement('span');
                num.textContent = 30 - i;
                
                let amt = document.createElement('span');
                amt.textContent = '$' + prizeLadderAmounts[29 - i].toLocaleString();
                
                // 保險線標記
                if (29 - i === 9 || 29 - i === 19 || 29-i === 29) {
                    div.classList.add('prize-safe');
                }
                
                div.appendChild(num);
                div.appendChild(amt);
                ladder.appendChild(div);
            }
            updateLadderUI();
        }

        function updateLadderUI() {
            document.querySelectorAll('.prize-item').forEach(el => {
                el.classList.remove('prize-current', 'prize-past');
            });
            const currentDiv = document.getElementById(`prize-${29 - currentQIndex}`);
            if(currentDiv) {
                currentDiv.classList.add('prize-current');
                const ladder = document.querySelector('.prize-ladder');
                ladder.scrollTop = Math.max(0, currentDiv.offsetTop - ladder.offsetTop - ladder.clientHeight / 2);
            }
            
            for(let i = 29 - currentQIndex + 1; i < 30; i++){
                const pastDiv = document.getElementById(`prize-${i}`);
                if(pastDiv) pastDiv.classList.add('prize-past');
            }
        }

        function startTimer() {
            sessionClock=Date.now();
            document.getElementById('timer-display').textContent='00:00';
            timerInterval=setInterval(()=>{
                timerSeconds=Math.floor((Date.now()-sessionClock)/1000);
                document.getElementById('timer-display').textContent=formatTime(timerSeconds);
            },1000);
        }
        function formatTime(seconds) {return Math.floor(seconds/60).toString().padStart(2,'0')+':'+(seconds%60).toString().padStart(2,'0');}
        // ------------------ 遊戲流程 ------------------
        function loadQuestion() {
            isAnswering = false;
            updateLadderUI();
            
            const q = gameQuestions[currentQIndex];
            document.getElementById('q-number').textContent = currentQIndex + 1;
            
            let diffText = q.diff === 'easy' ? '淺' : (q.diff === 'medium' ? '中' : '深');
            document.getElementById('q-difficulty').textContent = `(難度：${diffText})`;
            document.getElementById('question-text').textContent = q.question;

            for (let i = 0; i < 4; i++) {
                const btn = document.getElementById(`ans-${i}`);
                btn.classList.remove('answer-selected', 'answer-correct', 'answer-wrong', 'answer-hidden');
                btn.disabled = false;
                document.getElementById(`text-${i}`).textContent = q.options[i];
            }

            // 更新保險線
            if (currentQIndex === 10) guaranteedPrize = 10000;
            if (currentQIndex === 20) guaranteedPrize = 1000000;
        }

        function selectAnswer(idx) {
            if(isAnswering || document.getElementById('ans-'+idx).disabled) return;
            isAnswering=true;
            const q=gameQuestions[currentQIndex];
            answerLog.push({id:q.id,answer:q.options[idx]});
            for(let i=0;i<4;i++)document.getElementById('ans-'+i).disabled=true;
            ['btn-5050','btn-audience','btn-friend'].forEach(id=>document.getElementById(id).disabled=true);
            document.getElementById('ans-'+idx).classList.add(idx===q.correctIdx?'answer-correct':'answer-wrong');
            document.getElementById('ans-'+q.correctIdx).classList.add('answer-correct');
            setTimeout(()=>{
                if(idx===q.correctIdx) {
                    currentQIndex++;
                    if(currentQIndex===30)endGame(true);else {restoreLifelinesBtn();loadQuestion();}
                } else endGame(false);
            },900);
        }
        function restoreLifelinesBtn() {
            document.getElementById('btn-5050').disabled = !lifelines.fifty;
            document.getElementById('btn-audience').disabled = !lifelines.audience;
            document.getElementById('btn-friend').disabled = !lifelines.friend;
        }

        // ------------------ 錦囊功能 ------------------
        function use5050() {
            if (!lifelines.fifty || isAnswering) return;
            lifelines.fifty = false;
            document.getElementById('btn-5050').disabled = true;
            document.getElementById('btn-5050').classList.add('opacity-30');

            const correctIdx = gameQuestions[currentQIndex].correctIdx;
            let wrongIndices = [0, 1, 2, 3].filter(i => i !== correctIdx);
            wrongIndices = shuffle(wrongIndices);
            
            // 隱藏兩個錯誤答案
            document.getElementById(`ans-${wrongIndices[0]}`).classList.add('answer-hidden');
            document.getElementById(`ans-${wrongIndices[1]}`).classList.add('answer-hidden');
            document.getElementById(`ans-${wrongIndices[0]}`).disabled = true;
            document.getElementById(`ans-${wrongIndices[1]}`).disabled = true;
        }

        function useAudience() {
            if (!lifelines.audience || isAnswering) return;
            lifelines.audience = false;
            document.getElementById('btn-audience').disabled = true;
            document.getElementById('btn-audience').classList.add('opacity-30');

            const q = gameQuestions[currentQIndex];
            const correctIdx = q.correctIdx;
            
            // 決定正確率
            let correctPercent;
            if (q.diff === 'easy') correctPercent = Math.floor(Math.random() * 21) + 70; // 70-90%
            else if (q.diff === 'medium') correctPercent = Math.floor(Math.random() * 21) + 45; // 45-65%
            else correctPercent = Math.floor(Math.random() * 21) + 30; // 30-50%

            let remaining = 100 - correctPercent;
            let votes = [0,0,0,0];
            votes[correctIdx] = correctPercent;
            
            // 隨機分配剩餘票數
            let wrongIndices = [0,1,2,3].filter(i => i !== correctIdx);
            
            // 如果用了 5050，只分配給剩下的錯誤答案
            if(wrongIndices.some(i => document.getElementById(`ans-${i}`).classList.contains('answer-hidden'))){
                let visibleWrong = wrongIndices.find(i => !document.getElementById(`ans-${i}`).classList.contains('answer-hidden'));
                if(visibleWrong !== undefined) votes[visibleWrong] = remaining;
            } else {
                let v1 = Math.floor(Math.random() * remaining);
                let v2 = Math.floor(Math.random() * (remaining - v1));
                let v3 = remaining - v1 - v2;
                votes[wrongIndices[0]] = v1;
                votes[wrongIndices[1]] = v2;
                votes[wrongIndices[2]] = v3;
            }

            // 繪製圖表
            const chart = document.getElementById('audience-chart');
            chart.innerHTML = '';
            const labels = ['A', 'B', 'C', 'D'];
            for(let i=0; i<4; i++){
                let wrapper = document.createElement('div');
                wrapper.className = 'bar-wrapper';
                let bar = document.createElement('div');
                bar.className = 'bar';
                bar.style.height = '0%'; // 動畫起始
                
                let val = document.createElement('div');
                val.textContent = votes[i] + '%';
                val.className = 'text-sm font-bold text-yellow-300';
                
                let lbl = document.createElement('div');
                lbl.className = 'bar-label text-white';
                lbl.textContent = labels[i];

                wrapper.appendChild(val);
                wrapper.appendChild(bar);
                wrapper.appendChild(lbl);
                chart.appendChild(wrapper);

                // 動畫
                setTimeout(() => { bar.style.height = (votes[i] * 1.1) + 'px'; }, 100);
            }

            document.getElementById('modal-audience').classList.remove('hidden');
        }

        function useFriend() {
            if (!lifelines.friend || isAnswering) return;
            lifelines.friend = false;
            document.getElementById('btn-friend').disabled = true;
            document.getElementById('btn-friend').classList.add('opacity-30');

            const q = gameQuestions[currentQIndex];
            const labels = ['A', 'B', 'C', 'D'];
            let isFriendCorrect = true;
            
            // 朋友正確率
            let roll = Math.random() * 100;
            if (q.diff === 'easy' && roll > 95) isFriendCorrect = false;
            else if (q.diff === 'medium' && roll > 75) isFriendCorrect = false;
            else if (q.diff === 'hard' && roll > 50) isFriendCorrect = false;

            let suggestedIdx = q.correctIdx;
            if (!isFriendCorrect) {
                let wrongIndices = [0,1,2,3].filter(i => i !== q.correctIdx && !document.getElementById(`ans-${i}`).classList.contains('answer-hidden'));
                suggestedIdx = wrongIndices[Math.floor(Math.random() * wrongIndices.length)];
            }

            let text = "";
            if (q.diff === 'easy') text = `「呢題咁簡單，一定係 ${labels[suggestedIdx]} 啦！」`;
            else if (q.diff === 'medium') text = `「我記得溫習筆記好似有講過，應該係 ${labels[suggestedIdx]}，信我！」`;
            else text = `「嘩呢題好深... 我得一半把握，可能係 ${labels[suggestedIdx]} 啩...」`;

            document.getElementById('friend-text').textContent = text;
            document.getElementById('modal-friend').classList.remove('hidden');
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
        }

        // ------------------ 遊戲結束與數據上傳 ------------------
        function endGame(isWin) {
            clearInterval(timerInterval);
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');

            let finalPrize = 0;
            if (isWin) {
                finalPrize = prizeLadderAmounts[29]; // 10億
                document.getElementById('result-title').textContent = "恭喜你！成為十億富翁！";
                document.getElementById('result-subtitle').textContent = "歷史之神降臨！";
            } else {
                finalPrize = guaranteedPrize;
                document.getElementById('result-title').textContent = "遊戲結束";
                const missed = gameQuestions[currentQIndex];
                document.getElementById('result-subtitle').textContent = '重溫：' + missed.question + ' 正確答案：' + missed.options[missed.correctIdx];
                document.getElementById('result-title').classList.replace('text-yellow-400', 'text-red-500');
            }

            document.getElementById('res-name').textContent = studentData.name;
            document.getElementById('res-q').textContent = `${currentQIndex} / 30 題`;
            timerSeconds=Math.floor((Date.now()-sessionClock)/1000);
            document.getElementById('res-time').textContent = formatTime(timerSeconds);
            document.getElementById('res-prize').textContent = '$' + finalPrize.toLocaleString();

            renderAnswerReview();
            uploadData(finalPrize, currentQIndex);
        }

        function renderAnswerReview() {
            const panel=document.getElementById('answer-review');panel.textContent='';
            answerLog.forEach((entry,i)=>{
                const q=gameQuestions[i],card=document.createElement('div');card.className='review-card';
                const title=document.createElement('p');title.textContent=(i+1)+'. '+q.question;
                const answer=document.createElement('p');answer.textContent='你選：'+entry.answer+'；正確答案：'+q.options[q.correctIdx];
                const exp=document.createElement('p');exp.textContent='解析：'+q.explanation;
                card.appendChild(title);card.appendChild(answer);card.appendChild(exp);panel.appendChild(card);
            });
        }
        function uploadData() {
            const status=document.getElementById('upload-status');
            if(!currentRun) {status.textContent='本局為練習模式，成績未上傳。';return;}
            pendingSubmission={runId:currentRun.runId,playerToken:playerToken(),answers:answerLog.map(a=>({...a}))};
            retrySubmission();
        }
        async function retrySubmission() {
            if(!pendingSubmission || submitBusy)return;
            submitBusy=true;
            const payload=pendingSubmission,status=document.getElementById('upload-status'),button=document.getElementById('retry-upload');
            status.textContent='正在核對作答並更新線上排行榜…';button.classList.add('hidden');
            try {
                const result=await onlineCall('submitRankedRun',payload);
                if(!currentRun||currentRun.runId!==payload.runId)return;
                if(!result||!Number.isInteger(result.correct)||!Number.isFinite(result.seconds))throw new Error('伺服器回覆格式有誤，請重試。');
                status.textContent=`伺服器已確認：答對 ${result.correct}/30 題，用時 ${formatTime(result.seconds)}。`+(result.improved?'已更新本瀏覽器的最佳紀錄。':'已保存本局；排行榜保留較佳紀錄。');
                pendingSubmission=null;
            } catch(err) {
                if(currentRun&&currentRun.runId===payload.runId) {status.textContent='尚未確認登榜：'+err.message;button.classList.remove('hidden');}
            } finally {if(currentRun&&currentRun.runId===payload.runId)submitBusy=false;}
        }
        function openLeaderboard() {
            leaderboardReturnFocus=document.activeElement;
            document.getElementById('board-grade').value=document.getElementById('grade').value;
            document.getElementById('modal-leaderboard').classList.remove('hidden');
            document.getElementById('board-grade').focus();loadLeaderboard();
        }
        function closeLeaderboard() {
            document.getElementById('modal-leaderboard').classList.add('hidden');boardRequest++;
            if(leaderboardReturnFocus)leaderboardReturnFocus.focus();
        }
        async function loadLeaderboard() {
            const request=++boardRequest,status=document.getElementById('board-status'),body=document.getElementById('board-rows');
            body.textContent='';
            if(!hasOnlineService()){status.textContent='目前為離線版，請使用老師提供的 GitHub Pages 或備用遊戲網址。';return;}
            status.textContent='正在讀取排行榜…';
            try {
                const board=await onlineCall('getLeaderboard',document.getElementById('board-grade').value);
                if(request!==boardRequest)return;
                if(board.version!==BOARD_VERSION||!Array.isArray(board.entries))throw new Error('排行榜版本不符，請重新整理。');
                if(!board.entries.length){status.textContent='暫時未有成績，完成排行模式即可登榜。';return;}
                board.entries.forEach(e=>{
                    const row=document.createElement('tr');
                    [e.rank,e.alias,e.correct+'/30',formatTime(e.seconds)].forEach(value=>{const cell=document.createElement('td');cell.textContent=String(value);row.appendChild(cell);});
                    body.appendChild(row);
                });
                status.textContent='共 '+board.totalPlayers+' 位玩家紀錄 · 顯示前20名 · 排行用時由伺服器計算（含連線及判題時間）';
            } catch(err) {if(request===boardRequest)status.textContent='讀取失敗：'+err.message+' 可按「重新整理」重試。';}
        }
        document.addEventListener('keydown',event=>{if(event.key==='Escape')closeLeaderboard();});
        function updateScope() {
            document.getElementById('scope').textContent = document.getElementById('grade').value === 's1' ? '華夏起源、堯舜禹、夏商周、春秋戰國' : '五代十國、宋代政治與變法、宋室興亡、經濟及貿易';
        }
        function backToIntro() {
            clearInterval(timerInterval);
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('intro-screen').classList.remove('hidden');
            currentRun=null;
        }
        // ------------------ 新增：無縫重新啟動遊戲功能 ------------------
        function restartGame() {startGame();}
    </script>
